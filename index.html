<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Carretinha Educativa do Juliano</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #F0F9FF;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }
        .truck-animation {
            animation: drive 10s linear infinite;
        }
        @keyframes drive {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(100vw); }
        }
        .finger {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <!-- Cabeçalho e Navegação -->
    <header class="bg-amber-400 border-b-4 border-amber-500 shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <!-- Título do App -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">
                <span class="text-4xl">🚚</span>
                <div>
                    <h1 class="text-2xl font-bold text-amber-950 leading-none">Carretinha do Juliano</h1>
                    <p class="text-xs text-amber-800 font-semibold">Aprender a Jogar e Brincar!</p>
                </div>
            </div>

            <!-- Contador de Estrelas e Áudio -->
            <div class="flex items-center gap-3">
                <div class="bg-amber-100 border-2 border-amber-300 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-inner">
                    <span class="text-2xl">⭐</span>
                    <span id="star-count" class="text-xl font-bold text-amber-900">0</span>
                </div>
                <button onclick="toggleSound()" id="sound-btn" class="bg-amber-100 p-2 rounded-full border-2 border-amber-300 text-xl shadow hover:bg-amber-200 transition">
                    🔊
                </button>
            </div>
        </div>

        <!-- Menu de Abas -->
        <nav class="bg-amber-300 border-t border-amber-400">
            <div class="max-w-5xl mx-auto flex justify-around p-1 text-xs sm:text-base font-bold">
                <button onclick="switchTab('home')" id="tab-home" class="tab-btn px-3 py-2 rounded-lg bg-amber-500 text-white shadow">
                    🏠 Início
                </button>
                <button onclick="switchTab('abc')" id="tab-abc" class="tab-btn px-3 py-2 rounded-lg text-amber-950 hover:bg-amber-400">
                    🔤 ABC
                </button>
                <button onclick="switchTab('counting')" id="tab-counting" class="tab-btn px-3 py-2 rounded-lg text-amber-950 hover:bg-amber-400">
                    🖐️ Contar (1 a 50)
                </button>
                <button onclick="switchTab('tables')" id="tab-tables" class="tab-btn px-3 py-2 rounded-lg text-amber-950 hover:bg-amber-400">
                    ✖️ Tabuada
                </button>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-5xl mx-auto w-full p-4 flex-grow">

        <!-- TELA INICIAL (HOME) -->
        <section id="sec-home" class="space-y-6">
            <!-- Animação da Carretinha -->
            <div class="relative overflow-hidden bg-sky-200 rounded-2xl p-6 border-4 border-sky-300 shadow-inner h-44 flex items-end">
                <div class="truck-animation absolute bottom-2 flex items-center gap-1">
